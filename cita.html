<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Una cita ❤️</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#08060a;color:#fff;font-family:Georgia,serif;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(92vw,500px);padding:28px;border-radius:24px;background:#ffffff12;border:1px solid #ffffff25;text-align:center}h1{font-weight:normal}button,input,select{font:17px Georgia,serif}button{border:0;border-radius:999px;padding:13px 24px;cursor:pointer}#yes,#confirm{background:#ff4d6d;color:#fff}#no{background:#eee;color:#222}.buttons{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}#form,#result{display:none;text-align:left}.row{margin:15px 0}label{display:block;margin-bottom:7px}input,select{width:100%;padding:12px;border-radius:12px;border:1px solid #aaa;background:#fff;color:#222}#confirm{width:100%;margin-top:8px}.center{text-align:center}</style></head><body>
<div class="card" id="start"><h1 id="q">Lele, ¿querés tener una cita conmigo? ❤️</h1><div class="buttons"><button id="yes">Sí ❤️</button><button id="no">No</button></div></div>
<div class="card" id="form"><h1>Entonces tenemos una cita 🥰</h1><div class="row"><label>Día 📅</label><input id="date" type="date"></div><div class="row"><label>Hora 🕐</label><input id="time" type="time"></div><div class="row"><label>¿Qué te gustaría hacer? 💭</label><select id="act"><option value="">Elegí una opción...</option><option>🍕 Comer algo</option><option>🎬 Ver una película</option><option>☕ Tomar algo</option><option>🚶 Salir a caminar</option><option>🏀 Hacer algo juntos</option><option>💭 Lo que vos quieras</option></select></div><button id="confirm">Confirmar nuestra cita ❤️</button></div>
<div class="card center" id="result"><h1>¡Cita confirmada! ❤️</h1><p id="sum"></p><p>Ya estoy esperando verte, Lele 🥰</p></div>
<script>let n=0;no.onclick=()=>{n++;q.textContent=n==1?'¿Segura? 👀':n==2?'Creo que querías apretar que sí 😌':'Ese botón sigue sin funcionar 😂❤️';no.style.transform=`translate(${(Math.random()-.5)*100}px,${(Math.random()-.5)*50}px)`};yes.onclick=()=>{start.style.display='none';form.style.display='block'};confirm.onclick=()=>{let d=date.value,t=time.value,a=act.value;if(!d||!t||!a){alert('Elegí el día, la hora y qué te gustaría hacer ❤️');return}let [y,m,day]=d.split('-');sum.innerHTML=`📅 <b>${day}/${m}/${y}</b><br>🕐 <b>${t}</b><br>💭 <b>${a}</b>`;form.style.display='none';result.style.display='block'};</script></body></html>
