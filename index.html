<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>❤️</title>

  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #050509;
    }

    canvas {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

  <canvas id="c"></canvas>

  <script>
    const c = document.getElementById('c');
    const x = c.getContext('2d');

    function sz() {
      let d = Math.min(devicePixelRatio || 1, 2);

      c.width = innerWidth * d;
      c.height = innerHeight * d;

      x.setTransform(d, 0, 0, d, 0, 0);
    }

    sz();
    onresize = sz;


    // Puntos que forman el corazón
    let P = [];

    const N = 160;

    const C = [
      '#ff4d6d',
      '#ff758f',
      '#ff8fab',
      '#ffd166',
      '#c77dff',
      '#72ddf7'
    ];


    for (let i = 0; i < N; i++) {

      let t = i / N * Math.PI * 2;

      P.push({
        x: 16 * Math.sin(t) ** 3,

        y:
          13 * Math.cos(t)
          - 5 * Math.cos(2 * t)
          - 2 * Math.cos(3 * t)
          - Math.cos(4 * t),

        c: C[i % C.length]
      });

    }


    let p = 0;


    function draw() {

      // Fondo
      x.fillStyle = '#050509';

      x.fillRect(
        0,
        0,
        innerWidth,
        innerHeight
      );


      // Tamaño del corazón
      let s =
        Math.min(innerWidth, innerHeight) / 34;


      // Centro
      let cx = innerWidth / 2;
      let cy = innerHeight / 2 - s * 0.5;


      // Dibujar corazón
      for (let i = 0; i < Math.floor(p); i++) {

        let q = P[i];

        let xx = cx + q.x * s;
        let yy = cy - q.y * s;


        x.beginPath();

        x.moveTo(cx, cy);

        x.lineTo(xx, yy);

        x.strokeStyle = q.c;

        x.globalAlpha = 0.78;

        x.stroke();
      }


      x.globalAlpha = 1;


      // Continuar formando el corazón
      if (p < N) {
        p += 0.8;
      }


      requestAnimationFrame(draw);
    }


    draw();

  </script>

</body>

</html>
