<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🌹</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#21091d}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById("c"),ctx=c.getContext("2d");
let W,H,dpr;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
resize();addEventListener("resize",resize);

const hearts=[];
for(let i=0;i<24;i++) hearts.push({x:Math.random(),y:Math.random(),s:3+Math.random()*4,v:.08+Math.random()*.16,p:Math.random()*Math.PI*2});

function heart(x,y,s,a){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.globalAlpha=a;ctx.strokeStyle="#d889d0";ctx.lineWidth=.7;
 ctx.beginPath();ctx.moveTo(0,3);ctx.bezierCurveTo(-6,-2,-4,-7,0,-4);ctx.bezierCurveTo(4,-7,6,-2,0,3);ctx.stroke();ctx.restore();
}

function stem(cx,fy,by,t){
 const sway=Math.sin(t*.0012)*7;ctx.save();ctx.lineCap="round";
 ctx.beginPath();ctx.moveTo(cx,fy+20);ctx.bezierCurveTo(cx-4,fy+90,cx+sway,by-50,cx+sway*1.4,by);
 ctx.strokeStyle="#4fba86";ctx.lineWidth=2;ctx.stroke();

 ctx.beginPath();ctx.moveTo(cx-4,fy+105);ctx.bezierCurveTo(cx-35,fy+82,cx-48,fy+92,cx-50,fy+103);
 ctx.bezierCurveTo(cx-31,fy+111,cx-15,fy+108,cx-4,fy+105);ctx.fillStyle="#3f9e70";ctx.fill();
 ctx.beginPath();ctx.moveTo(cx-6,fy+105);ctx.lineTo(cx-43,fy+100);ctx.strokeStyle="#70d69c";ctx.lineWidth=.8;ctx.stroke();

 ctx.beginPath();ctx.moveTo(cx+2,fy+145);ctx.bezierCurveTo(cx+25,fy+120,cx+43,fy+124,cx+49,fy+138);
 ctx.bezierCurveTo(cx+31,fy+151,cx+14,fy+149,cx+2,fy+145);ctx.fillStyle="#3f9e70";ctx.fill();
 ctx.beginPath();ctx.moveTo(cx+3,fy+145);ctx.lineTo(cx+43,fy+137);ctx.strokeStyle="#70d69c";ctx.lineWidth=.8;ctx.stroke();
 ctx.restore();
}

function rose(cx,cy,progress){
 const layers=Math.floor(progress*34);ctx.save();
 for(let layer=0;layer<layers;layer++){
  const lp=Math.min(1,progress*34-layer+.15),radius=7+layer*1.75,turns=1.65+layer*.035;
  ctx.beginPath();
  for(let j=0;j<90*lp;j++){
   const q=j/90,ang=q*Math.PI*2*turns+layer*.42;
   const r=radius*q+Math.sin(ang*3+layer)*1.8*q;
   const xx=cx+Math.cos(ang)*r,yy=cy+Math.sin(ang)*r*.72;
   j?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);
  }
  ctx.strokeStyle=`hsla(${302+Math.sin(layer*.55)*10},85%,${42+(layer%5)*5}%,.75)`;
  ctx.lineWidth=2.1;ctx.stroke();
 }
 const g=ctx.createRadialGradient(cx,cy,0,cx,cy,38);
 g.addColorStop(0,"rgba(255,210,250,.55)");g.addColorStop(.35,"rgba(255,90,220,.18)");g.addColorStop(1,"rgba(255,0,200,0)");
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,38,0,Math.PI*2);ctx.fill();ctx.restore();
}

const start=performance.now();
function animate(now){
 const t=now-start;ctx.clearRect(0,0,W,H);ctx.fillStyle="#21091d";ctx.fillRect(0,0,W,H);
 const fy=H*.34+Math.sin(t*.001)*3,cx=W/2,by=Math.min(H*.86,fy+260);
 hearts.forEach(h=>{const y=((h.y*H-t*h.v)%(H+30)+H+30)%(H+30)-15,x=h.x*W+Math.sin(t*.001+h.p)*12;heart(x,y,h.s/5,.45)});
 stem(cx,fy+5,by,t);rose(cx,fy,Math.min(1,t/6500));requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
